              - textbox "章节原文" [ref=e121]: 星海历第七纪元3842年。 第七殖民星域。 苍穹星航道。 天际号缓缓脱离轨道空间站。 巨大的舰体在恒星光芒照射下泛着银白色光辉。 这是一艘标准大型民用运输舰。 长度超过三十公里。 拥有完整生态循环系统。 能够长期执行跨星系航行任务。 对于第七殖民星域的人来说。 天际号并不特殊。 它只是无数运输舰中的一艘。 如同城市间往返的列车。 日复一日。 年复一年。 运行在已经存在数百年的殖民航线上。 --- 船上的两万余名乘客来自不同世界。 不同阶层。 不同身份。 却拥有同一个目的地。 苍穹星。 第七殖民星域的行政中心。 商业中心。 教育中心。 也是无数殖民地居民眼中的文明中心。 --- 有人准备在那里开始新的工作。 有人准备进入更高等级的学校。 有人准备拓展生意。 有人准备与家人团聚。 还有人只是单纯结束了一段漫长旅程。 --- 对于绝大多数人来说。 这只是人生中一次普通出行。 没有人会记住这一天。 就像没有人会记住自己乘坐过的每一次交通工具。 --- 观景大厅里。 孩子们追逐打闹。 老人们悠闲聊天。 情侣依偎在观景窗前。 商人讨论市场行情。 旅客浏览着最新新闻。 服务机器人穿梭在人群之间。 整个大厅充满轻松而愉快的气氛。 --- 星创帝国依然强盛。 航道依然安全。 贸易依然繁荣。 战争距离这里十分遥远。 混乱属于边疆。 危险属于法外之地。 而这里属于文明。 属于秩序。 属于被无数人视为理所当然的未来。 --- 主角站在观景窗前。 看着外面的群星。 他的父母就在不远处。 一家人正在讨论抵达苍穹星之后的安排。 或许会先找一家餐厅。 或许会去新的居住区。 或许会开始新的生活。 这只是一次普通家庭之间再普通不过的谈话。 没有人会把这些话记在心里。 --- 因为谁也不会想到。 这将是他们最后一次以帝国公民的身份讨论未来。 --- 与此同时。 在天际号深层导航系统中。 一道极其微弱的数据波动一闪而过。 持续时间不足零点一秒。 随后消失。 系统没有报警。 工作人员没有发现。 乘客更不会知道。 --- 天际号继续向前。 驶离空间站。 驶向苍穹星。 也驶向所有人都无法预料的命运。 此时此刻。 船上的两万余人依然相信。 自己生活在一个稳定而永恒的文明之中。 他们不知道。 几个小时后。 天际号将从星创帝国的航道记录中彻底消失。 成为第七殖民星域历史上最著名的失踪事件之一。 而对于船上的人来说。 真正的旅程。 才刚刚开始。
